<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>انضم لتجار نجيب سليم</title>
<meta name="description" content="سجّل محلك مع نجيب سليم للأقمشة وأكثر وفريقنا هيتواصل معاك.">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap"><span class="logo-plate"><img src="logo.png" alt="نجيب سليم للأقمشة وأكثر"></span><picture class="partner"><source srcset="egypthometex-white.png" media="(prefers-color-scheme: dark)"><img src="egypthometex.png" alt="Egypt HomeTex"></picture></div></header>
<div class="weave" aria-hidden="true"></div>
<main>
<section id="view-form">
  <div class="wrap">
    <div class="banner"><img src="hometex-banner.jpg" alt="معرض Egypt HomeTex الثامن للتنجيد والستائر والمنسوجات — 22-25 أكتوبر 2026، مركز القاهرة الدولي للمؤتمرات" width="1640" height="720"></div>
    <div class="hero">
      <div class="eyebrow">تجار نجيب سليم</div>
      <h1>انضم لتجار نجيب سليم</h1>
      <p class="lead">سجّل بيانات محلك وفريقنا هيتواصل معاك لعرض تشكيلة الأقمشة والمفروشات وأسعار الجملة المتاحة لمحافظتك.</p>
    </div>

    <form class="reg card" id="reg" novalidate>
      <div class="field" id="f-name">
        <label for="name">اسم التاجر <span class="req">*</span></label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="مثال: أحمد محمود" maxlength="80">
        <div class="msg" hidden></div>
      </div>
      <div class="field" id="f-phone">
        <label for="phone">رقم الهاتف <span class="req">*</span></label>
        <div class="phone-row">
          <span class="cc">+20</span>
          <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="01012345678" maxlength="14">
        </div>
        <div class="hint">رقم موبايل مصري من 11 رقم، ويفضّل يكون عليه واتساب</div>
        <div class="msg" hidden></div>
      </div>
      <div class="field" id="f-gov">
        <label for="gov">المحافظة <span class="req">*</span></label>
        <select id="gov" name="gov"><option value="">اختر المحافظة</option></select>
        <div class="msg" hidden></div>
      </div>
      <div class="field" id="f-shop">
        <label for="shop">اسم المحل <span class="req">*</span></label>
        <input id="shop" name="shop" type="text" placeholder="مثال: مفروشات النور" maxlength="100">
        <div class="msg" hidden></div>
      </div>
      <div class="notice err" id="form-err" hidden></div>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp">
      <button class="btn" type="submit" id="submit">إرسال البيانات</button>
    </form>

    <div class="done card" id="done" hidden>
      <div class="tick" aria-hidden="true">✓</div>
      <h2>تم استلام بياناتك</h2>
      <p class="lead" id="done-msg">شكرًا لتسجيلك. هنتواصل معاك قريب على رقمك.</p>
      <button class="btn ghost" type="button" id="again">تسجيل محل آخر</button>
    </div>

    <div class="wa-box">
      <a class="wa-link" href="https://wa.me/201008800874" target="_blank" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.6-.3z"/></svg>
        تواصل معنا واتساب
      </a>
    </div>
  </div>
</section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
const C=window.NS_CONFIG;
const GOVS=["القاهرة","الجيزة","الإسكندرية","القليوبية","الدقهلية","الشرقية","الغربية","المنوفية","البحيرة","كفر الشيخ","دمياط","بورسعيد","الإسماعيلية","السويس","الفيوم","بني سويف","المنيا","أسيوط","سوهاج","قنا","الأقصر","أسوان","البحر الأحمر","الوادي الجديد","مطروح","شمال سيناء","جنوب سيناء"];
const $=id=>document.getElementById(id);
GOVS.forEach(g=>$("gov").add(new Option(g,g)));
const sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:false}});
const toW=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
function normPhone(v){let p=toW(v).replace(/\D/g,"");if(p.startsWith("0020"))p=p.slice(4);else if(p.startsWith("20")&&p.length===12)p=p.slice(2);if(p.length===10&&p[0]==="1")p="0"+p;return p;}
function setErr(id,msg){const f=$(id),m=f.querySelector(".msg");f.classList.toggle("bad",!!msg);m.hidden=!msg;m.textContent=msg||"";}
function validate(){
  const name=$("name").value.trim(),shop=$("shop").value.trim(),gov=$("gov").value,phone=normPhone($("phone").value);
  let ok=true;
  if(name.length<2){setErr("f-name","اكتب اسم التاجر");ok=false}else setErr("f-name");
  if(!/^01[0125]\d{8}$/.test(phone)){setErr("f-phone","الرقم لازم يكون 11 رقم ويبدأ بـ 010 أو 011 أو 012 أو 015");ok=false}else setErr("f-phone");
  if(!gov){setErr("f-gov","اختر المحافظة");ok=false}else setErr("f-gov");
  if(shop.length<2){setErr("f-shop","اكتب اسم المحل");ok=false}else setErr("f-shop");
  return ok?{name,phone,governorate:gov,shop_name:shop}:null;
}
["name","phone","gov","shop"].forEach(id=>$(id).addEventListener("input",()=>{if($(id).closest(".field").classList.contains("bad"))validate();}));
$("reg").addEventListener("submit",async e=>{
  e.preventDefault();$("form-err").hidden=true;
  const data=validate();if(!data){const b=document.querySelector(".field.bad input,.field.bad select");b&&b.focus();return;}
  if($("website").value){$("reg").hidden=true;$("done").hidden=false;return;} // spam bot
  const btn=$("submit");btn.disabled=true;btn.textContent="جاري الإرسال…";
  try{
    const {error}=await sb.from("merchants").insert(data);
    if(error)throw error;
    $("reg").hidden=true;$("done").hidden=false;
    $("done-msg").textContent="شكرًا يا "+data.name+". هنتواصل معاك قريب على رقم "+data.phone+".";
    $("reg").reset();
  }catch(err){
    $("form-err").textContent="حصل خطأ في الإرسال. جرّب تاني، أو تواصل معنا على واتساب.";
    $("form-err").hidden=false;
  }finally{btn.disabled=false;btn.textContent="إرسال البيانات";}
});
$("again").addEventListener("click",()=>{$("done").hidden=true;$("reg").hidden=false;$("name").focus();});
})();
</script>
</body>
</html>
